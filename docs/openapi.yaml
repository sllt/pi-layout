                  code:
                    type: integer
                    format: int64
                  data:
                    type: object
                    nullable: true
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        rule:
                          type: string
                      required:
                        - field
                        - rule
                  message:
