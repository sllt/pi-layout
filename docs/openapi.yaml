        - password
    UpdateProfileRequest:
      type: object
      properties:
        email:
          type: string
          description: 邮箱
        nickname:
          type: string
          description: 昵称
      required:
        - email
  securitySchemes:
    Bearer:
      type: http
      description: Bearer JWT token
      scheme: bearer
      bearerFormat: JWT
